name: Build

on:
  push:
    branches: [main, 'stage-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Настоящий xunit и сборка всего решения (включая WPF) на Windows.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test VectorAtc.sln -c Release --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

  # Один .exe без установки: .NET внутри файла. Не зависит от job test, чтобы файл можно было получить даже при красных тестах.
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file exe
        run: dotnet publish src/VectorAtc.App -p:PublishProfile=SingleExe
      - name: Show result
        shell: pwsh
        run: Get-Item src/VectorAtc.App/bin/publish/VectorATC.exe | Select-Object Name, Length
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: VectorATC-exe
          path: src/VectorAtc.App/bin/publish/VectorATC.exe
          if-no-files-found: error
  # Установщик: программа в обычной папке (быстрый запуск), ярлыки, удаление через «Приложения». Ставится без прав администратора.
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish app folder
        run: dotnet publish src/VectorAtc.App -p:PublishProfile=Installer
      - name: Count files
        shell: pwsh
        run: |
          $files = Get-ChildItem src/VectorAtc.App/bin/publish-installer -Recurse -File
          "$($files.Count) files, $([math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB)) MB"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.1.${{ github.run_number }}" installer\VectorATC.iss
          Get-Item dist\VectorATC-Setup.exe | Select-Object Name, Length
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VectorATC-Setup
          path: dist/VectorATC-Setup.exe
          if-no-files-found: error
      - name: Attach installer to the release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VectorATC-Setup.exe
          prerelease: true
      - name: Remove the old single-file exe from the latest release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest VectorATC.exe --yes --repo ${{ github.repository }}
      - name: Publish latest build to the release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Vector ATC 1.0
          body: Автоматическая сборка последнего состояния main. Скачайте VectorATC-Setup.exe и запустите его.
          files: dist/VectorATC-Setup.exe
          prerelease: false
          make_latest: true
